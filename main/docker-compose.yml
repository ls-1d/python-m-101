services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile 
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=development
    ports:
      - 8001:5000
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: mysql
    restart: always
    environment:
      - MYSQL_DATABASE=main
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - dbdata-flask:/var/lib/mysql
    ports:
      - 33067:3306

volumes:
  dbdata-flask: